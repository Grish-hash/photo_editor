<!DOCTYPE html>
<html lang="en">

    <ul class="navbar">

            <div class="dropdown-content">

        <h2>Sign Up</h2>

        <form>

            <label>Name</label><br>
            <input type="text"><br><br>

            <label>Email</label><br>

            <label>Password</label><br>
            <input type="password"><br><br>

            <input type="submit" value="Register">

        </form>
