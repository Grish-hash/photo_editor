<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhotoEditor Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="header">

    <h1 id="pagetitle">📸 PhotoEditor</h1>

    <ul class="navbar">

        <li class="dropdown">

            <a href="#">Home</a>

            <div class="dropdown-content">
                <a href="#">Services</a>
                <a href="#">Gallery</a>
                <a href="#">Pricing</a>
            </div>

        </li>

        <li><a href="#">About</a></li>
        <li><a href="#">Model</a></li>
        <li><a href="#">Others</a></li>

    </ul>

</div>


<div class="container">

    <!-- Sign In -->

    <div class="box">

        <h2>Sign In</h2>

        <form id = "loginForm">

            <label>Username / Email</label><br>
            <input type="text" id="loginUsername"><br><br>

            <label>Password</label><br>
            <input type="password" id="loginPassword">
            <br><br>

            <button type="button" id="showLoginPassword">
                Show Password
            </button>

            <input type="submit" value="Login">

        </form>

        <p id="loginMessage"></p>

    </div>


    <!-- Sign Up -->

    <div class="box">

        <h2>Sign Up</h2>

        <form id="signupForm">

            <label>Name</label><br>
            <input type="text" id="signupName">
            <br><br>

            <label>Email</label><br>
            <input type="email"  id="signupEmail">
            <br><br>

            <label>Password</label><br>
            <input type="password" id="signupPassword">
            <br><br>

            <button type="button" id="showSignupPassword">
                Show Password
            </button>

            <input type="submit" value="Register">

        </form>

        <p id="signupMessage"></p>

    </div>

    <div class="footer">
        <p>© 2026 PhotoEditor | All Rights Reserved</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
